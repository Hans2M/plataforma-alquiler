<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="Búsqueda de alojamientos y personas para compartir vivienda" />
    <meta name="theme-color" content="#126daf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AlojaRed | Alojamientos y convivencia</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar destellos.
      (function () {
        try {
          var guardado = localStorage.getItem('alojaRedTema');
          var sistemaOscuro = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var tema = guardado === 'claro' || guardado === 'oscuro'
            ? guardado
            : (sistemaOscuro ? 'oscuro' : 'claro');
          document.documentElement.dataset.tema = tema;
          document.documentElement.style.colorScheme = tema === 'oscuro' ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', tema === 'oscuro' ? '#0a1420' : '#126daf');
        } catch (error) {
          document.documentElement.dataset.tema = 'claro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
